# Separate workspace: these tests build for the HOST target (not RISC-V) and run
# the compiled on-chain binaries inside ckb-testtool's mock VM.
[workspace]

[package]
name = "tests"
version = "0.1.0"
edition = "2021"
license = "MIT"

# ckb-testtool is used by src/lib.rs (the Loader), so it is a normal dependency.
[dependencies]
ckb-testtool = "0.14"
# The real secp256k1_blake160_sighash_all, already in the lock file through ckb-testtool,
# for owner-consent controls that need a lock which refuses an unsigned spend.
ckb-system-scripts = "0.5.4"

[dev-dependencies]
cells-core = { path = "../crates/cells-core" }
